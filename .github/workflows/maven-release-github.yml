name: Release to GitHub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Verify tag matches project version
        shell: bash
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${VERSION}." >&2
            exit 1
          fi

      - name: Build and publish Maven packages
        run: mvn -B -Ppackage deploy --file pom.xml --settings "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create or update GitHub release
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              kafka-connect-http/target/*.tar.gz \
              kafka-connect-http/target/*.zip \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              kafka-connect-http/target/*.tar.gz \
              kafka-connect-http/target/*.zip \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
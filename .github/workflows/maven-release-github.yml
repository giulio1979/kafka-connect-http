name: Release to GitHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, with or without the v prefix (for example, 0.8.16)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Resolve and verify release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          mvn -B help:evaluate \
            -Dexpression=project.version \
            -Doutput="${RUNNER_TEMP}/project-version.txt"
          VERSION="$(tr -d '[:space:]' < "${RUNNER_TEMP}/project-version.txt")"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="v${INPUT_VERSION#v}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          if [[ "v${VERSION}" != "${RELEASE_TAG}" ]]; then
            echo "Release ${RELEASE_TAG} does not match project version v${VERSION}." >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Maven packages
        run: mvn -B -Ppackage deploy --file pom.xml --settings "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              kafka-connect-http/target/*.tar.gz \
              kafka-connect-http/target/*.zip \
              --clobber
          else
            RELEASE_ARGS=(--generate-notes --title "${RELEASE_TAG}")
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              RELEASE_ARGS+=(--target "${GITHUB_SHA}")
            else
              RELEASE_ARGS+=(--verify-tag)
            fi
            gh release create "${RELEASE_TAG}" \
              kafka-connect-http/target/*.tar.gz \
              kafka-connect-http/target/*.zip \
              "${RELEASE_ARGS[@]}"
          fi